name: connectme_app
description: "ConnectMe: a Flutter community app with Firebase, biometrics and a members map."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # State management and dependency injection
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

  # Device features
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  device_info_plus: ^13.3.0
  shared_preferences: ^2.5.5

  # Maps
  google_maps_flutter: ^2.18.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true